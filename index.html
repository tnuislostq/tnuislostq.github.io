<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('tkv-portfolio-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = theme === 'light' ? '#f1ede3' : '#101913';
      }());
    </script>
    <title>Tanu Vishwakarma — Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Tanu Vishwakarma featuring 10+ live full-stack projects (Django, FastAPI, React), AWS certification, credentials, and interactive CLI." />
    <meta property="og:title" content="Tanu Vishwakarma — Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer building end-to-end React/Next.js and Python (Django, FastAPI) applications with live deployments." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
