<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanu Vishwakarma — Junior Full-Stack Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(26, 36, 56, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.35);
      --accent-cyan: #38bdf8;
      --accent-blue: #2563eb;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Ambient Lighting */
    .glow-bg {
      position: fixed;
      top: -200px;
      right: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .glow-bg-bottom {
      position: fixed;
      bottom: -200px;
      left: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    /* Marquee Banner */
    .marquee-container {
      width: 100%;
      background: #0f172a;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .marquee-content {
      display: inline-block;
      animation: marquee 26s linear infinite;
    }

    .marquee-content span {
      margin-right: 35px;
    }

    .marquee-content span.highlight {
      color: var(--accent-cyan);
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Navigation Bar */
    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(9, 13, 22, 0.85);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 1000;
    }

    .nav-wrapper {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-logo span {
      color: var(--accent-cyan);
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 28px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .nav-menu a {
      color: var(--text-muted);
      transition: var(--transition);
    }

    .nav-menu a:hover {
      color: var(--accent-cyan);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-cyan);
      border-radius: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-cyan);
      transition: var(--transition);
    }

    .nav-cta:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    /* Containers & Spacing */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 80px 0;
    }

    .section-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 650px;
      margin-bottom: 40px;
      font-size: 1rem;
    }

    /* Hero Section */
    .hero {
      padding: 100px 0 80px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 50px;
    }

    .hero-role-lead {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .hero-headline {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.2px;
      margin-bottom: 20px;
    }

    .hero-headline .highlight-name {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .typewriter-text {
      color: var(--accent-cyan);
      border-right: 2px solid var(--accent-cyan);
      white-space: nowrap;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: var(--accent-cyan); }
    }

    .hero-bio {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .hero-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .btn-primary {
      padding: 12px 26px;
      background: var(--accent-cyan);
      color: #06111f;
      font-weight: 700;
      border-radius: 8px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
